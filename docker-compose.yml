services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage
      POSTGRES_DB: triage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Files in this directory run once, in name order, on first boot.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d triage"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgres://triage:triage@postgres:5432/triage
      PORT: 3000
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      DEDUP_WINDOW_SEC: ${DEDUP_WINDOW_SEC:-300}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./apps/worker
    environment:
      DATABASE_URL: postgres://triage:triage@postgres:5432/triage
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-20}
      WORKER_POLL_SEC: ${WORKER_POLL_SEC:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
